# decomp-toolkit analysis config for Phantasy Star Online Episode I & II Plus (USA, GPOE8P, rev 2).
# Analysis only (function boundaries, jump tables, relocations, SDK identification) feeding the static
# recompiler. Not a matching-decomp build. PsoV3.dol is the game; main.dol only loads it.
name: PsoV3
object: baserom/PsoV3.dol
hash: 0d85744b51d7379efb025a943d0cd5aaae2191a3
# First run: copy symbols_seed.txt to symbols.txt (dtk rewrites symbols.txt with everything it finds).
symbols: config/GPOE8P/symbols.txt
splits: config/GPOE8P/splits.txt
detect_objects: true
detect_strings: false
write_asm: true

# movie.rel: CRI's Sofdec movie player, the only code module PsoV3.dol loads at run time (OSLink from
# 0x80320478, for the attract movie and cutscenes). Recompiled at a fixed address like Riders' _Main.rel.
modules:
- object: baserom/movie.rel
  hash: 767332daf33120d9497dc6426ed644c46bbf3ff3
  name: movie
  symbols: config/GPOE8P/movie/symbols.txt
  splits: config/GPOE8P/movie/splits.txt
